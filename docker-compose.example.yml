version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: journalpw
      POSTGRES_DB: journaldb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-05-01T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  db_data:
  minio_data:
